<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pre-Installation Requirements</title>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Open Sans', sans-serif;
      font-size: 18px;
    }

    .intro-banner {
      background: #EAF0FF;
      border-left: 4px solid #246EFF;
      border-radius: 0 8px 8px 0;
      padding: 1.25rem 1.5rem;
      width: 100%;
      min-height: 100px;
      max-height: 200px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .intro-banner p {
      color: #1a1a1a;
      line-height: 1.6;
      margin-bottom: 10px;
    }

    .instruction {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 600;
      color: #246EFF;
    }

    .instruction svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="intro-banner">
    <p>The following tools should also be brought to an installation:</p>
    <div class="instruction">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="#246EFF" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5"/>
      </svg>
      <span>Click all FOUR cards to review what you'll need.</span>
    </div>
  </div>
</body>
</html>
